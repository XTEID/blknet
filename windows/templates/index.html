<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #2a2a4a;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scan-btn {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .scan-btn:active {
            transform: scale(0.95);
        }

        .scan-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .scan-btn svg {
            width: 16px;
            height: 16px;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff4757, #c0392b);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:active { transform: scale(0.95); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .action-btn.green {
            background: linear-gradient(135deg, #00ff88, #009955);
            color: #000;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-row .action-btn {
            flex: 1;
            justify-content: center;
        }

        .net-info {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            font-size: 11px;
            color: #888;
        }

        .net-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .net-info b {
            color: #00d4ff;
        }

        .stats {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .stat-card {
            flex: 1;
            background: #1a1a2e;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 1px solid #2a2a4a;
        }

        .stat-num {
            font-size: 22px;
            font-weight: 800;
        }

        .stat-num.green { color: #00ff88; }
        .stat-num.red { color: #ff4757; }
        .stat-num.blue { color: #00d4ff; }

        .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1a1a2e;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .spinner-sm {
            width: 14px;
            height: 14px;
            border: 2px solid #1a1a2e;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .scan-banner {
            margin: 12px 16px 0;
            background: linear-gradient(135deg, #0d1b2a 0%, #0a1520 100%);
            border: 1px solid #00d4ff44;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #00d4ff;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .device-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .device-card {
            background: #1a1a2e;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #2a2a4a;
            transition: all 0.2s;
        }

        .device-card.blocked {
            border-color: #ff4757;
            background: #2a1a1a;
        }

        .device-card.self {
            border-color: #00ff88;
        }

        .device-card.gateway {
            border-color: #ffa502;
        }

        .device-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .device-icon svg {
            width: 22px;
            height: 22px;
        }

        .icon-default { background: #2a2a4a; color: #00d4ff; }
        .icon-blocked { background: #3a1a1a; color: #ff4757; }
        .icon-self { background: #1a3a1a; color: #00ff88; }
        .icon-gateway { background: #3a2a0a; color: #ffa502; }

        .device-info {
            flex: 1;
            min-width: 0;
        }

        .device-ip {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .device-mac {
            font-size: 11px;
            color: #666;
            font-family: monospace;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .device-vendor {
            font-size: 11px;
            color: #888;
            margin-top: 1px;
        }

        .device-badge {
            display: inline-block;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 600;
        }

        .badge-self { background: #00ff8822; color: #00ff88; }
        .badge-gateway { background: #ffa50222; color: #ffa502; }
        .badge-blocked { background: #ff475722; color: #ff4757; }
        .badge-online { background: #00d4ff22; color: #00d4ff; }

        .block-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-block {
            background: #ff4757;
            color: #fff;
        }

        .btn-unblock {
            background: #00ff88;
            color: #000;
        }

        .btn-block:active, .btn-unblock:active {
            transform: scale(0.93);
        }

        .btn-block:disabled, .btn-unblock:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 12px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 16px;
            margin-top: 8px;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #555;
        }

        .empty svg {
            width: 48px;
            height: 48px;
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            bottom: 30px;
        }

        .toast.success { border-color: #00ff88; }
        .toast.error { border-color: #ff4757; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#00d4ff"/>
                </svg>
                <h1>NetGuard</h1>
            </div>
            <button class="scan-btn" id="scanBtn" onclick="scan()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                Scan
            </button>
        </div>
        <div class="net-info" id="netInfo"></div>
        <div class="stats" id="stats" style="display:none">
            <div class="stat-card">
                <div class="stat-num blue" id="totalNum">0</div>
                <div class="stat-label">Total Devices</div>
            </div>
            <div class="stat-card">
                <div class="stat-num green" id="onlineNum">0</div>
                <div class="stat-label">Online</div>
            </div>
            <div class="stat-card">
                <div class="stat-num red" id="blockedNum">0</div>
                <div class="stat-label">Blocked</div>
            </div>
        </div>
        <div class="btn-row" id="btnRow" style="display:none">
            <button class="action-btn" id="blockAllBtn" onclick="blockAll()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                Block All
            </button>
            <button class="action-btn green" id="unblockAllBtn" onclick="unblockAll()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 4 3 10 9 10"/></svg>
                Unblock All
            </button>
        </div>
    </div>

    <div id="content">
        <div class="loading">
            <div class="spinner"></div>
            <p>Scanning network...</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let scanning = false;
        let autoRefresh = null;
        let hasData = false;

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.className = 'toast', 2500);
        }

        function getIcon(type, blocked) {
            if (blocked) {
                return '<div class="device-icon icon-blocked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg></div>';
            }
            if (type === 'Router') {
                return '<div class="device-icon icon-gateway"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="18" x2="6.01" y2="18"/><line x1="10" y1="18" x2="10.01" y2="18"/><path d="M12 14V6M8 8l4-4 4 4"/></svg></div>';
            }
            if (type === 'This Device') {
                return '<div class="device-icon icon-self"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg></div>';
            }
            return '<div class="device-icon icon-default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>';
        }

        function deviceCard(d) {
            const cls = d.blocked ? 'blocked' : (d.self ? 'self' : (d.gateway ? 'gateway' : ''));
            let badge = '';
            if (d.self) badge = '<span class="device-badge badge-self">THIS DEVICE</span>';
            else if (d.gateway) badge = '<span class="device-badge badge-gateway">ROUTER</span>';
            else if (d.blocked) badge = '<span class="device-badge badge-blocked">BLOCKED</span>';
            else badge = '<span class="device-badge badge-online">ONLINE</span>';

            let btn = '';
            if (d.self || d.gateway) {
                btn = '';
            } else if (d.blocked) {
                btn = `<button class="block-btn btn-unblock" onclick="unblock('${d.ip}')">Unblock</button>`;
            } else {
                btn = `<button class="block-btn btn-block" onclick="block('${d.ip}','${d.mac}')">Block</button>`;
            }

            return `
                <div class="device-card ${cls}">
                    <div class="device-main">
                        ${getIcon(d.type, d.blocked)}
                        <div class="device-info">
                            <div class="device-ip">${d.ip}</div>
                            <div class="device-mac">${d.mac}</div>
                            <div class="device-vendor">${d.vendor}</div>
                            ${badge}
                        </div>
                        ${btn}
                    </div>
                </div>
            `;
        }

        function renderDevices(devices, data) {
            const online = devices.filter(d => !d.blocked).length;
            const blocked = devices.filter(d => d.blocked).length;

            document.getElementById('netInfo').innerHTML = `
                <span>Interface: <b>${data.interface}</b></span>
                <span>Subnet: <b>${data.subnet}</b></span>
                <span>Gateway: <b>${data.gateway}</b></span>
            `;

            document.getElementById('stats').style.display = 'flex';
            document.getElementById('btnRow').style.display = 'flex';
            document.getElementById('totalNum').textContent = devices.length;
            document.getElementById('onlineNum').textContent = online;
            document.getElementById('blockedNum').textContent = blocked;

            if (devices.length === 0) {
                return `<div class="empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <p>No devices found</p>
                </div>`;
            }

            devices.sort((a, b) => {
                if (a.self) return -1;
                if (b.self) return 1;
                if (a.gateway) return -1;
                if (b.gateway) return 1;
                return 0;
            });

            return '<div class="section-title">Connected Devices</div>' +
                   '<div class="device-list">' + devices.map(deviceCard).join('') + '</div>';
        }

        function showBanner(show) {
            const content = document.getElementById('content');
            let banner = document.getElementById('scanBanner');
            if (show) {
                if (!banner) {
                    banner = document.createElement('div');
                    banner.id = 'scanBanner';
                    banner.className = 'scan-banner';
                    banner.innerHTML = '<div class="spinner-sm"></div><span>Scanning network...</span>';
                    content.insertBefore(banner, content.firstChild);
                }
            } else {
                if (banner) banner.remove();
            }
        }

        async function scan() {
            if (scanning) return;
            scanning = true;
            const btn = document.getElementById('scanBtn');
            btn.disabled = true;

            if (!hasData) {
                // First scan — show full loading
                document.getElementById('content').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Scanning network...</p>
                    </div>
                `;
            } else {
                // Rescan — keep existing data, show banner
                showBanner(true);
            }

            try {
                const res = await fetch('/api/scan');
                const data = await res.json();

                if (data.error) {
                    showToast(data.error, 'error');
                    if (!hasData) {
                        document.getElementById('content').innerHTML = `<div class="empty"><p>Scan failed</p></div>`;
                    }
                    return;
                }

                const devices = data.devices || [];
                document.getElementById('content').innerHTML = renderDevices(devices, data);
                hasData = true;
            } catch (e) {
                showToast('Connection error', 'error');
            } finally {
                showBanner(false);
                scanning = false;
                btn.disabled = false;
            }
        }

        async function block(ip, mac) {
            try {
                const res = await fetch('/api/block', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ip, mac})
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`${ip} blocked`, 'success');
                    scan();
                } else {
                    showToast(data.error || 'Failed', 'error');
                }
            } catch (e) {
                showToast('Connection error', 'error');
            }
        }

        async function unblock(ip) {
            try {
                const res = await fetch('/api/unblock', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ip})
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`${ip} unblocked`, 'success');
                    scan();
                } else {
                    showToast(data.error || 'Failed', 'error');
                }
            } catch (e) {
                showToast('Connection error', 'error');
            }
        }

        async function blockAll() {
            const btn = document.getElementById('blockAllBtn');
            btn.disabled = true;
            showToast('Blocking all devices...', '');
            try {
                const res = await fetch('/api/block_all', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: '{}'
                });
                const data = await res.json();
                if (data.success) {
                    const count = data.results.filter(r => r.status === 'blocked').length;
                    showToast(`${count} devices blocked`, 'success');
                    scan();
                } else {
                    showToast(data.error || 'Failed', 'error');
                }
            } catch (e) {
                showToast('Connection error', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function unblockAll() {
            const btn = document.getElementById('unblockAllBtn');
            btn.disabled = true;
            showToast('Unblocking all devices...', '');
            try {
                const res = await fetch('/api/unblock_all', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: '{}'
                });
                const data = await res.json();
                if (data.success) {
                    const count = data.unblocked.length;
                    showToast(`${count} devices unblocked`, 'success');
                    scan();
                } else {
                    showToast(data.error || 'Failed', 'error');
                }
            } catch (e) {
                showToast('Connection error', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // Initial scan
        scan();
        // Auto-refresh every 15 seconds
        autoRefresh = setInterval(() => { if (!scanning) scan(); }, 15000);
    </script>
</body>
</html>
